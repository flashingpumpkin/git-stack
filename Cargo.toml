[package]
name = "git-stack"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Stacked-branch / stacked-PR workflow CLI with worktree-safe state"
license = "MIT"
repository = "https://github.com/flashingpumpkin/git-stack"

[lib]
name = "git_stack"
path = "src/lib.rs"

[[bin]]
name = "stack"
path = "src/bin/stack.rs"

[[bin]]
name = "git-stack"
path = "src/bin/git-stack.rs"

[[bin]]
name = "pool"
path = "src/bin/pool.rs"

[[bin]]
name = "git-pool"
path = "src/bin/git-pool.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
fd-lock = "4"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
time = { version = "=0.3.47", features = ["formatting", "parsing", "serde-well-known"] }
inquire = { version = "0.7", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
